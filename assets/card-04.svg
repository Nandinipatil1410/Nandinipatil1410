<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Private Assistant: Ask questions about medical, legal or money PDFs. A local model reads them. The cloud never does.">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs><linearGradient id="ember-lilac" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#C98BDB"/></linearGradient><linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="260" y2="0">
  <stop offset="0" stop-color="#FF8A3D" stop-opacity="0"/><stop offset=".5" stop-color="#FF8A3D" stop-opacity=".85"/><stop offset="1" stop-color="#C98BDB" stop-opacity="0"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;900 0" dur="6s" begin="-5.6s" repeatCount="indefinite"/>
</linearGradient></defs>
<rect width="600" height="300" rx="18" fill="#121015"/><rect x=".5" y=".5" width="599" height="299" rx="17.5" fill="none" stroke="#2A2630"/>

<rect x=".5" y=".5" width="599" height="299" rx="17.5" fill="none" stroke="url(#sweep)" stroke-width="1.5"/>
<g class="rise">
  <text x="32" y="48" class="mono" font-size="13" fill="#FF8A3D">04</text>
  <rect x="522" y="30" width="46" height="26" rx="13" fill="none" stroke="#3A3540"/><text x="545" y="47.5" text-anchor="middle" class="mono" font-size="12" fill="#CFC6BA">rag</text><rect x="446" y="30" width="68" height="26" rx="13" fill="none" stroke="#3A3540"/><text x="480" y="47.5" text-anchor="middle" class="mono" font-size="12" fill="#CFC6BA">ollama</text>
  <text x="30" y="106" class="serif" font-size="38" fill="#F4EEE4" letter-spacing="-.5">Private Assistant</text>
  <text x="32" y="142" class="sans" font-size="16" fill="#A39CAA">Ask questions about medical, legal or money PDFs.</text>
  <text x="32" y="166" class="sans" font-size="16" fill="#A39CAA">A local model reads them. The cloud never does.</text>
</g>
<line x1="32" y1="196" x2="568" y2="196" stroke="#2A2630" stroke-dasharray="3 5"/>
<g class="rise" style="animation-delay:.25s">
  <text x="30" y="260" class="serif" font-size="54" fill="#FF8A3D">0</text>
  <text x="89" y="238" class="mono" font-size="13" fill="#8B8592">documents uploaded</text>
  <text x="89" y="258" class="mono" font-size="13" fill="#8B8592">anywhere, ever</text>
</g>
<rect x="448" y="230" width="22" height="28" rx="3" fill="none" stroke="#CFC6BA" stroke-width="1.4"/>
<line x1="453" y1="238" x2="465" y2="238" stroke="#CFC6BA" stroke-width="1.2"/><line x1="453" y1="244" x2="463" y2="244" stroke="#CFC6BA" stroke-width="1.2"/><line x1="453" y1="250" x2="465" y2="250" stroke="#CFC6BA" stroke-width="1.2"/>
<path d="M534 256 h30 a9 9 0 0 0 0-18 a12 12 0 0 0-22-4 a9 9 0 0 0-8 22 z" fill="none" stroke="#6F6976" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cy="245" r="4" fill="#FF8A3D"><animate attributeName="cx" values="478;524;524;478" keyTimes="0;.42;.55;1" calcMode="spline" keySplines=".3 0 .5 1;0 0 1 1;.4 0 .2 1" dur="3s" repeatCount="indefinite"/></circle>
</svg>
