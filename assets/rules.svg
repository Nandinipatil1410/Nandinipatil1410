<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Three rules I build by: data stays home, agents need brakes, say it plainly.">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs><linearGradient id="ember-lilac" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#C98BDB"/></linearGradient></defs>
<rect width="1200" height="380" rx="22" fill="#121015"/><rect x=".5" y=".5" width="1199" height="379" rx="21.5" fill="none" stroke="#2A2630"/>

<g class="rise">
  <text x="40" y="62" class="mono" font-size="15" fill="#FF8A3D">01</text>
  <text x="78" y="66" class="serif" font-size="34" fill="#F4EEE4" letter-spacing="-.4">Three rules I build by</text>
  
</g>
<line x1="486" y1="56" x2="1160" y2="56" stroke="#2A2630"/>
<line x1="486" y1="56" x2="1160" y2="56" stroke="url(#ember-lilac)" stroke-width="1.4"
      stroke-dasharray="674" stroke-dashoffset="674">
  <animate attributeName="stroke-dashoffset" from="674" to="0" begin=".3s" dur="1.6s" fill="freeze"
           calcMode="spline" keySplines=".2 .7 .2 1" keyTimes="0;1"/>
</line>
<circle cy="56" r="3.2" fill="#FF8A3D">
  <animate attributeName="cx" values="486;1160" dur="6s" begin="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="6s" begin="2s" repeatCount="indefinite"/>
</circle>
<circle cx="486" cy="56" r="3.2" fill="#FF8A3D" opacity="0"/>
<g transform="translate(24 108)"><g class="rise" style="animation-delay:0.30s">
  <rect width="368" height="248" rx="16" fill="#19161D" stroke="#2A2630"/>
  
<path d="M40 82 V56 L66 34 L92 56 V82 Z" fill="none" stroke="#CFC6BA" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="57" y="56" width="18" height="22" rx="2.5" fill="none" stroke="#FF8A3D" stroke-width="1.6"/>
<line x1="61" y1="63" x2="71" y2="63" stroke="#FF8A3D" stroke-width="1.4"/><line x1="61" y1="69" x2="69" y2="69" stroke="#FF8A3D" stroke-width="1.4"/>
<path id="hop" d="M100 58 C160 14, 230 14, 280 54" fill="none" stroke="#2A2630" stroke-width="1.4" stroke-dasharray="3 5"/>
<path d="M286 78 h46 a13 13 0 0 0 0-26 a17 17 0 0 0-32-6 a13 13 0 0 0-14 32 z" fill="none" stroke="#6F6976" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="-4.5" y="-4.5" width="9" height="9" rx="2" fill="#FF8A3D">
  <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;.72;.72;0" keyTimes="0;.42;.56;1" calcMode="spline"
     keySplines=".3 0 .5 1;0 0 1 1;.4 0 .2 1"><mpath href="#hop"/></animateMotion>
</rect>
<g opacity="0" stroke="#C98BDB" stroke-width="2" stroke-linecap="round">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.4;.44;.56;.62;1" dur="3.6s" repeatCount="indefinite"/>
  <line x1="246" y1="24" x2="256" y2="34"/><line x1="256" y1="24" x2="246" y2="34"/>
</g>
  <text x="28" y="160" class="mono" font-size="12" fill="#FF8A3D">01</text>
  <text x="56" y="161" class="serif" font-size="25" fill="#F4EEE4">Data stays home.</text>
  <text x="28" y="196" class="sans" font-size="15.5" fill="#A39CAA">If a laptop can do the job,</text>
  <text x="28" y="220" class="sans" font-size="15.5" fill="#A39CAA">the cloud never sees the file.</text>
</g></g>
<g transform="translate(416 108)"><g class="rise" style="animation-delay:0.48s">
  <rect width="368" height="248" rx="16" fill="#19161D" stroke="#2A2630"/>
  
<line x1="28" y1="62" x2="340" y2="62" stroke="#2A2630" stroke-width="1.6"/>
<line x1="276" y1="36" x2="276" y2="88" stroke="#FF8A3D" stroke-width="2"/>
<text x="284" y="40" class="mono" font-size="11" fill="#FF8A3D">policy</text>
<circle cy="62" r="7" fill="#F4EEE4" opacity=".15"><animate attributeName="cx" values="38;262;262;38" keyTimes="0;.45;.85;1" calcMode="spline" keySplines=".15 .8 .2 1;0 0 1 1;.4 0 .6 1" dur="4s" begin="-.18s" repeatCount="indefinite"/></circle>
<circle cy="62" r="7" fill="#F4EEE4" opacity=".3"><animate attributeName="cx" values="38;262;262;38" keyTimes="0;.45;.85;1" calcMode="spline" keySplines=".15 .8 .2 1;0 0 1 1;.4 0 .6 1" dur="4s" begin="-.09s" repeatCount="indefinite"/></circle>
<circle cy="62" r="7" fill="#F4EEE4"><animate attributeName="cx" values="38;262;262;38" keyTimes="0;.45;.85;1" calcMode="spline" keySplines=".15 .8 .2 1;0 0 1 1;.4 0 .6 1" dur="4s" repeatCount="indefinite"/></circle>
<text x="262" y="100" text-anchor="middle" class="mono" font-size="11" fill="#8B8592" opacity="0">logged
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.47;.52;.82;.88" dur="4s" repeatCount="indefinite"/></text>
  <text x="28" y="160" class="mono" font-size="12" fill="#FF8A3D">02</text>
  <text x="56" y="161" class="serif" font-size="25" fill="#F4EEE4">Agents need brakes.</text>
  <text x="28" y="196" class="sans" font-size="15.5" fill="#A39CAA">Every move fits a written policy,</text>
  <text x="28" y="220" class="sans" font-size="15.5" fill="#A39CAA">every step lands in an audit log.</text>
</g></g>
<g transform="translate(808 108)"><g class="rise" style="animation-delay:0.66s">
  <rect width="368" height="248" rx="16" fill="#19161D" stroke="#2A2630"/>
  
<rect x="28" y="24" width="232" height="66" rx="16" fill="none" stroke="#CFC6BA" stroke-width="1.6"/>
<path d="M58 90 l-6 14 l20 -14" fill="#19161D" stroke="#CFC6BA" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="58" y1="90.5" x2="72" y2="90.5" stroke="#19161D" stroke-width="3"/>
<rect x="48" y="40" height="7" rx="3.5" fill="#FF8A3D" width="0"><animate attributeName="width" values="0;160;160;0" keyTimes="0;.16;.9;1" dur="5s" repeatCount="indefinite"/></rect>
<rect x="48" y="54" height="7" rx="3.5" fill="#CFC6BA" opacity=".55" width="0"><animate attributeName="width" values="0;0;190;190;0" keyTimes="0;.16;.34;.9;1" dur="5s" repeatCount="indefinite"/></rect>
<rect x="48" y="68" height="7" rx="3.5" fill="#CFC6BA" opacity=".55" width="0"><animate attributeName="width" values="0;0;96;96;0" keyTimes="0;.34;.46;.9;1" dur="5s" repeatCount="indefinite"/></rect>
<circle cx="300" cy="57" r="16" fill="none" stroke="#C98BDB" stroke-width="1.6" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.48;.54;.9;1" dur="5s" repeatCount="indefinite"/></circle>
<path d="M292 57 l6 6 l11 -12" fill="none" stroke="#C98BDB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.52;.58;.9;1" dur="5s" repeatCount="indefinite"/></path>
  <text x="28" y="160" class="mono" font-size="12" fill="#FF8A3D">03</text>
  <text x="56" y="161" class="serif" font-size="25" fill="#F4EEE4">Say it plainly.</text>
  <text x="28" y="196" class="sans" font-size="15.5" fill="#A39CAA">“Chrome used 3 GB, not its usual</text>
  <text x="28" y="220" class="sans" font-size="15.5" fill="#A39CAA">1.2” beats any CPU graph.</text>
</g></g>
</svg>
