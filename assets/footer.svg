<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Open to collaborating on local first AI, agent evaluation, or anything that makes software easier to understand.">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs><linearGradient id="ember-lilac" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#C98BDB"/></linearGradient><clipPath id="fclip"><rect width="1200" height="220" rx="22"/></clipPath></defs>
<rect width="1200" height="220" rx="22" fill="#121015"/><rect x=".5" y=".5" width="1199" height="219" rx="21.5" fill="none" stroke="#2A2630"/>

<g clip-path="url(#fclip)">
  <path d="M0 176 Q50.0 162 100.0 176 T200 176 T300 176 T400 176 T500 176 T600 176 T700 176 T800 176 T900 176 T1000 176 T1100 176 T1200 176 T1300 176 T1400 176 T1500 176 T1600 176 T1700 176 T1800 176 T1900 176 T2000 176 T2100 176 T2200 176 T2300 176 T2400 176 T2500 176 T2600 176" fill="none" stroke="#FF8A3D" stroke-opacity=".55" stroke-width="1.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;-200 0" dur="5s" repeatCount="indefinite"/></path>
  <path d="M0 186 Q65.0 176 130.0 186 T260 186 T390 186 T520 186 T650 186 T780 186 T910 186 T1040 186 T1170 186 T1300 186 T1430 186 T1560 186 T1690 186 T1820 186 T1950 186 T2080 186 T2210 186 T2340 186 T2470 186 T2600 186 T2730 186" fill="none" stroke="#C98BDB" stroke-opacity=".45" stroke-width="1.5">
    <animateTransform attributeName="transform" type="translate" values="-260 0;0 0" dur="7s" repeatCount="indefinite"/></path>
  <path d="M0 196 Q40.0 189 80.0 196 T160 196 T240 196 T320 196 T400 196 T480 196 T560 196 T640 196 T720 196 T800 196 T880 196 T960 196 T1040 196 T1120 196 T1200 196 T1280 196 T1360 196 T1440 196 T1520 196 T1600 196 T1680 196 T1760 196 T1840 196 T1920 196 T2000 196 T2080 196 T2160 196 T2240 196 T2320 196 T2400 196 T2480 196 T2560 196" fill="none" stroke="#F4EEE4" stroke-opacity=".12" stroke-width="1.2">
    <animateTransform attributeName="transform" type="translate" values="0 0;-160 0" dur="9s" repeatCount="indefinite"/></path>
</g>
<g class="rise">
  <text x="600" y="72" text-anchor="middle" class="serif" font-style="italic" font-size="25" fill="#F4EEE4">Open to collaborating on local first AI, agent evaluation,</text>
  <text x="600" y="106" text-anchor="middle" class="serif" font-style="italic" font-size="25" fill="#F4EEE4">or anything that makes software easier to understand.</text>
  <text x="600" y="142" text-anchor="middle" class="mono" font-size="12" fill="#8B8592">written locally, pushed reluctantly</text>
</g>
</svg>
