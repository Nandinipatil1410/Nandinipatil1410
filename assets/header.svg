<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Nandini Patil. I build AI that keeps your data on your laptop, and agents that know when to stop.">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs><linearGradient id="ember-lilac" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#C98BDB"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#F4EEE4" opacity=".05"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<clipPath id="card"><rect width="1200" height="420" rx="22"/></clipPath>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0">
  <stop offset="0" stop-color="#F4EEE4"/><stop offset=".5" stop-color="#FFC59B"/><stop offset="1" stop-color="#F4EEE4"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-420 0;1500 0" dur="7s" begin="1s" repeatCount="indefinite"/>
</linearGradient>
<clipPath id="type1"><rect x="56" y="214" width="0" height="44"><animate attributeName="width" from="0" to="680" begin=".7s" dur="1.5s" fill="freeze"/></rect></clipPath>
<clipPath id="type2"><rect x="56" y="254" width="0" height="44"><animate attributeName="width" from="0" to="680" begin="2.2s" dur="1.1s" fill="freeze"/></rect></clipPath></defs>

<rect width="1200" height="420" rx="22" fill="#121015"/>
<g clip-path="url(#card)">
  <circle cx="900" cy="120" r="220" fill="#FF8A3D" opacity=".20" filter="url(#blur)">
    <animate attributeName="cx" values="900;980;860;900" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;200;260;120" dur="19s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="380" r="240" fill="#C98BDB" opacity=".16" filter="url(#blur)">
    <animate attributeName="cx" values="380;260;460;380" dur="21s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="380;300;420;380" dur="17s" repeatCount="indefinite"/>
  </circle>
  <rect width="1200" height="420" fill="url(#dots)"/>
</g>

<g class="rise">
  <text x="64" y="83" class="mono" font-size="15" fill="#8B8592">~/nandini</text>
  <rect x="166" y="64" width="108" height="28" rx="14" fill="none" stroke="#3A3540"/><text x="220" y="82.5" text-anchor="middle" class="mono" font-size="12" fill="#CFC6BA">local first</text><rect x="284" y="64" width="130" height="28" rx="14" fill="none" stroke="#3A3540"/><text x="349" y="82.5" text-anchor="middle" class="mono" font-size="12" fill="#CFC6BA">bounded agents</text><rect x="424" y="64" width="108" height="28" rx="14" fill="none" stroke="#3A3540"/><text x="479" y="82.5" text-anchor="middle" class="mono" font-size="12" fill="#CFC6BA">plain words</text>
</g>
<g class="rise" style="animation-delay:.15s">
  <text x="58" y="186" class="serif" font-size="92" fill="url(#shine)" letter-spacing="-1.5">Nandini Patil</text>
</g>
<g clip-path="url(#type1)"><text x="64" y="244" class="serif" font-style="italic" font-size="27" fill="#CFC6BA">I build AI that keeps your data on your laptop,</text></g>
<g clip-path="url(#type2)"><text x="64" y="282" class="serif" font-style="italic" font-size="27" fill="#CFC6BA">and agents that know when to stop.</text></g>

<g class="rise" style="animation-delay:3.1s">
  <rect x="64" y="326" width="300" height="40" rx="10" fill="#19161D" stroke="#2A2630"/>
  <text x="82" y="351" class="mono" font-size="14" fill="#8B8592"><tspan fill="#FF8A3D">$</tspan> bytes_sent_to_cloud <tspan fill="#F4EEE4">0</tspan></text>
  <rect class="cursor" x="321" y="338" width="9" height="17" fill="#FF8A3D"/>
</g>

<g transform="translate(776 66)">
  <g class="rise" style="animation-delay:.4s">
    <rect width="364" height="290" rx="16" fill="#19161D" stroke="#2A2630"/>
    <circle cx="22" cy="22" r="4.5" fill="#3A3540"/><circle cx="38" cy="22" r="4.5" fill="#3A3540"/><circle cx="54" cy="22" r="4.5" fill="#3A3540"/>
    <text x="342" y="27" text-anchor="end" class="mono" font-size="12" fill="#6F6976">why-slow / today</text>
    <line x1="20" y1="222" x2="344" y2="222" stroke="#2A2630"/>
    <rect class="bar" x="24" y="170" width="9" height="52" rx="2" fill="#4A4452" style="animation-delay:-0.00s"/><rect class="bar" x="37" y="180" width="9" height="42" rx="2" fill="#4A4452" style="animation-delay:-0.37s"/><rect class="bar" x="50" y="160" width="9" height="62" rx="2" fill="#4A4452" style="animation-delay:-0.74s"/><rect class="bar" x="63" y="176" width="9" height="46" rx="2" fill="#4A4452" style="animation-delay:-1.11s"/><rect class="bar" x="76" y="186" width="9" height="36" rx="2" fill="#4A4452" style="animation-delay:-1.48s"/><rect class="bar" x="89" y="168" width="9" height="54" rx="2" fill="#4A4452" style="animation-delay:-1.85s"/><rect class="bar" x="102" y="178" width="9" height="44" rx="2" fill="#4A4452" style="animation-delay:-2.22s"/><rect class="bar" x="115" y="158" width="9" height="64" rx="2" fill="#4A4452" style="animation-delay:-2.59s"/><rect class="bar" x="128" y="150" width="9" height="72" rx="2" fill="#4A4452" style="animation-delay:-2.96s"/><rect class="bar" x="141" y="118" width="9" height="104" rx="2" fill="#FF8A3D" style="animation-delay:-0.13s"/><rect class="bar" x="154" y="96" width="9" height="126" rx="2" fill="#FF8A3D" style="animation-delay:-0.50s"/><rect class="bar" x="167" y="84" width="9" height="138" rx="2" fill="#FF8A3D" style="animation-delay:-0.87s"/><rect class="bar" x="180" y="100" width="9" height="122" rx="2" fill="#FF8A3D" style="animation-delay:-1.24s"/><rect class="bar" x="193" y="126" width="9" height="96" rx="2" fill="#FF8A3D" style="animation-delay:-1.61s"/><rect class="bar" x="206" y="140" width="9" height="82" rx="2" fill="#FF8A3D" style="animation-delay:-1.98s"/><rect class="bar" x="219" y="152" width="9" height="70" rx="2" fill="#4A4452" style="animation-delay:-2.35s"/><rect class="bar" x="232" y="172" width="9" height="50" rx="2" fill="#4A4452" style="animation-delay:-2.72s"/><rect class="bar" x="245" y="182" width="9" height="40" rx="2" fill="#4A4452" style="animation-delay:-3.09s"/><rect class="bar" x="258" y="166" width="9" height="56" rx="2" fill="#4A4452" style="animation-delay:-0.26s"/><rect class="bar" x="271" y="176" width="9" height="46" rx="2" fill="#4A4452" style="animation-delay:-0.63s"/><rect class="bar" x="284" y="188" width="9" height="34" rx="2" fill="#4A4452" style="animation-delay:-1.00s"/><rect class="bar" x="297" y="170" width="9" height="52" rx="2" fill="#4A4452" style="animation-delay:-1.37s"/><rect class="bar" x="310" y="180" width="9" height="42" rx="2" fill="#4A4452" style="animation-delay:-1.74s"/><rect class="bar" x="323" y="174" width="9" height="48" rx="2" fill="#4A4452" style="animation-delay:-2.11s"/>
    <text x="20" y="246" class="mono" font-size="11" fill="#6F6976">14:00</text>
    <text x="344" y="246" text-anchor="end" class="mono" font-size="11" fill="#6F6976">14:30</text>
    <text x="20" y="272" class="mono" font-size="11" fill="#8B8592">1 bar = 1 minute</text>
  </g>
  <g>
    <line y1="60" y2="226" stroke="#F4EEE4" stroke-opacity=".55" stroke-dasharray="2 3">
      <animate attributeName="x1" values="20;344" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="20;344" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.36;.41;.66;.71;1" dur="7s" repeatCount="indefinite"/>
    <rect x="86" y="34" width="196" height="34" rx="9" fill="#F4EEE4"/>
    <path d="M178 68 l7 8 l7 -8 z" fill="#F4EEE4"/>
    <text x="184" y="56" text-anchor="middle" class="mono" font-size="12" fill="#121015">chrome used 3 GB, not 1.2</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="419" rx="21.5" fill="none" stroke="#2A2630"/>
</svg>
