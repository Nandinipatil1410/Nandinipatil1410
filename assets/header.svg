<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Nandini Patil. I build AI that keeps your data on your laptop, and agents that know when to stop.">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .rise{opacity:0;animation:rise .9s ease-out forwards}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .tip{opacity:0;animation:tip 6s ease-in-out 1.2s infinite}
    @keyframes tip{0%,8%{opacity:0}14%,70%{opacity:1}78%,100%{opacity:0}}
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#F4EEE4" opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" rx="22" fill="#121015"/>
  <rect width="1200" height="380" rx="22" fill="url(#dots)"/>
  <rect width="1200" height="380" rx="22" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="379" rx="21.5" fill="none" stroke="#2A2630"/>

  <!-- left: name + promise -->
  <g class="rise">
    <text x="64" y="82" class="mono" font-size="15" fill="#8B8592" letter-spacing=".5">~/nandini   <tspan fill="#FF8A3D">●</tspan> local-first · bounded agents · plain words</text>
    <text x="60" y="178" class="serif" font-size="84" fill="#F4EEE4" letter-spacing="-1">Nandini Patil</text>
  </g>
  <g class="rise" style="animation-delay:.25s">
    <text x="64" y="238" class="serif" font-style="italic" font-size="26" fill="#CFC6BA">I build AI that keeps your data on your laptop —</text>
    <text x="64" y="274" class="serif" font-style="italic" font-size="26" fill="#CFC6BA">and agents that know when to stop.</text>
  </g>
  <g class="rise" style="animation-delay:.5s">
    <text x="64" y="330" class="mono" font-size="15" fill="#8B8592">$ bytes_sent_to_cloud <tspan fill="#FF8A3D">→ 0</tspan></text>
    <rect class="cursor" x="296" y="317" width="9" height="17" fill="#FF8A3D"/>
  </g>

  <!-- right: a tiny "why-slow" timeline -->
  <g transform="translate(772 58)">
    <rect width="364" height="264" rx="14" fill="#19161D" stroke="#2A2630"/>
    <circle cx="22" cy="22" r="4.5" fill="#3A3540"/>
    <circle cx="38" cy="22" r="4.5" fill="#3A3540"/>
    <circle cx="54" cy="22" r="4.5" fill="#3A3540"/>
    <text x="342" y="27" text-anchor="end" class="mono" font-size="12" fill="#6F6976">today · 1 bar = 1 min</text>
    <line x1="20" y1="222" x2="344" y2="222" stroke="#2A2630"/>

    <g fill="#4A4452">
      <rect class="bar" x="24"  y="170" width="9" height="52" rx="2" style="animation-delay:-.2s"/>
      <rect class="bar" x="37"  y="180" width="9" height="42" rx="2" style="animation-delay:-.6s"/>
      <rect class="bar" x="50"  y="160" width="9" height="62" rx="2" style="animation-delay:-1.1s"/>
      <rect class="bar" x="63"  y="176" width="9" height="46" rx="2" style="animation-delay:-1.7s"/>
      <rect class="bar" x="76"  y="186" width="9" height="36" rx="2" style="animation-delay:-2.3s"/>
      <rect class="bar" x="89"  y="168" width="9" height="54" rx="2" style="animation-delay:-.4s"/>
      <rect class="bar" x="102" y="178" width="9" height="44" rx="2" style="animation-delay:-1.4s"/>
      <rect class="bar" x="115" y="158" width="9" height="64" rx="2" style="animation-delay:-2.0s"/>
      <rect class="bar" x="128" y="150" width="9" height="72" rx="2" style="animation-delay:-2.8s"/>
      <rect class="bar" x="219" y="152" width="9" height="70" rx="2" style="animation-delay:-.9s"/>
      <rect class="bar" x="232" y="172" width="9" height="50" rx="2" style="animation-delay:-1.9s"/>
      <rect class="bar" x="245" y="182" width="9" height="40" rx="2" style="animation-delay:-2.5s"/>
      <rect class="bar" x="258" y="166" width="9" height="56" rx="2" style="animation-delay:-.1s"/>
      <rect class="bar" x="271" y="176" width="9" height="46" rx="2" style="animation-delay:-1.2s"/>
      <rect class="bar" x="284" y="188" width="9" height="34" rx="2" style="animation-delay:-2.1s"/>
      <rect class="bar" x="297" y="170" width="9" height="52" rx="2" style="animation-delay:-.7s"/>
      <rect class="bar" x="310" y="180" width="9" height="42" rx="2" style="animation-delay:-1.6s"/>
      <rect class="bar" x="323" y="174" width="9" height="48" rx="2" style="animation-delay:-2.6s"/>
    </g>
    <g fill="#FF8A3D">
      <rect class="bar" x="141" y="118" width="9" height="104" rx="2" style="animation-delay:-.3s"/>
      <rect class="bar" x="154" y="96"  width="9" height="126" rx="2" style="animation-delay:-.8s"/>
      <rect class="bar" x="167" y="84"  width="9" height="138" rx="2" style="animation-delay:-1.3s"/>
      <rect class="bar" x="180" y="100" width="9" height="122" rx="2" style="animation-delay:-1.8s"/>
      <rect class="bar" x="193" y="126" width="9" height="96"  rx="2" style="animation-delay:-2.4s"/>
      <rect class="bar" x="206" y="140" width="9" height="82"  rx="2" style="animation-delay:-2.9s"/>
    </g>

    <text x="20"  y="244" class="mono" font-size="11" fill="#6F6976">14:00</text>
    <text x="344" y="244" text-anchor="end" class="mono" font-size="11" fill="#6F6976">14:30</text>

    <g class="tip">
      <rect x="104" y="40" width="172" height="34" rx="8" fill="#F4EEE4"/>
      <path d="M166 74 l7 8 l7 -8 z" fill="#F4EEE4"/>
      <text x="190" y="62" text-anchor="middle" class="mono" font-size="12" fill="#121015">chrome · 3.0 GB, not 1.2</text>
    </g>
  </g>
</svg>
