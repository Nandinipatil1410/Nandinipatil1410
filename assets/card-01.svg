<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="why-slow: Tells you why your laptop was slow, in plain words. Click a slow minute to see the app behind it.">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs><linearGradient id="ember-lilac" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#C98BDB"/></linearGradient><linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="260" y2="0">
  <stop offset="0" stop-color="#FF8A3D" stop-opacity="0"/><stop offset=".5" stop-color="#FF8A3D" stop-opacity=".85"/><stop offset="1" stop-color="#C98BDB" stop-opacity="0"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;900 0" dur="6s" begin="-1.4s" repeatCount="indefinite"/>
</linearGradient></defs>
<rect width="600" height="300" rx="18" fill="#121015"/><rect x=".5" y=".5" width="599" height="299" rx="17.5" fill="none" stroke="#2A2630"/>

<rect x=".5" y=".5" width="599" height="299" rx="17.5" fill="none" stroke="url(#sweep)" stroke-width="1.5"/>
<g class="rise">
  <text x="32" y="48" class="mono" font-size="13" fill="#FF8A3D">01</text>
  <rect x="493" y="30" width="75" height="26" rx="13" fill="none" stroke="#3A3540"/><text x="530" y="47.5" text-anchor="middle" class="mono" font-size="12" fill="#CFC6BA">offline</text><rect x="417" y="30" width="68" height="26" rx="13" fill="none" stroke="#3A3540"/><text x="451" y="47.5" text-anchor="middle" class="mono" font-size="12" fill="#CFC6BA">python</text>
  <text x="30" y="106" class="serif" font-size="38" fill="#F4EEE4" letter-spacing="-.5">why-slow</text>
  <text x="32" y="142" class="sans" font-size="16" fill="#A39CAA">Tells you why your laptop was slow, in plain words.</text>
  <text x="32" y="166" class="sans" font-size="16" fill="#A39CAA">Click a slow minute to see the app behind it.</text>
</g>
<line x1="32" y1="196" x2="568" y2="196" stroke="#2A2630" stroke-dasharray="3 5"/>
<g class="rise" style="animation-delay:.25s">
  <text x="30" y="260" class="serif" font-size="54" fill="#FF8A3D">5s</text>
  <text x="122" y="238" class="mono" font-size="13" fill="#8B8592">sampled, fully offline,</text>
  <text x="122" y="258" class="mono" font-size="13" fill="#8B8592">nothing leaves the laptop</text>
</g>
<rect class="bar" x="448" y="244" width="7" height="18" rx="1.5" fill="#4A4452" style="animation-delay:-0.00s"/><rect class="bar" x="460" y="238" width="7" height="24" rx="1.5" fill="#4A4452" style="animation-delay:-0.31s"/><rect class="bar" x="472" y="246" width="7" height="16" rx="1.5" fill="#4A4452" style="animation-delay:-0.62s"/><rect class="bar" x="484" y="234" width="7" height="28" rx="1.5" fill="#4A4452" style="animation-delay:-0.93s"/><rect class="bar" x="496" y="240" width="7" height="22" rx="1.5" fill="#4A4452" style="animation-delay:-1.24s"/><rect class="bar" x="508" y="222" width="7" height="40" rx="1.5" fill="#FF8A3D" style="animation-delay:-1.55s"/><rect class="bar" x="520" y="218" width="7" height="44" rx="1.5" fill="#FF8A3D" style="animation-delay:-1.86s"/><rect class="bar" x="532" y="236" width="7" height="26" rx="1.5" fill="#4A4452" style="animation-delay:-2.17s"/><rect class="bar" x="544" y="244" width="7" height="18" rx="1.5" fill="#4A4452" style="animation-delay:-2.48s"/><rect class="bar" x="556" y="240" width="7" height="22" rx="1.5" fill="#4A4452" style="animation-delay:-2.79s"/>
</svg>
