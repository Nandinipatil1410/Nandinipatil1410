<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Recovery Agent: Recovers failed recurring payments using only policy-safe moves, and stops when it should.">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs><linearGradient id="ember-lilac" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#C98BDB"/></linearGradient><linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="260" y2="0">
  <stop offset="0" stop-color="#FF8A3D" stop-opacity="0"/><stop offset=".5" stop-color="#FF8A3D" stop-opacity=".85"/><stop offset="1" stop-color="#C98BDB" stop-opacity="0"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;900 0" dur="6s" begin="-2.8s" repeatCount="indefinite"/>
</linearGradient></defs>
<rect width="600" height="300" rx="18" fill="#121015"/><rect x=".5" y=".5" width="599" height="299" rx="17.5" fill="none" stroke="#2A2630"/>

<rect x=".5" y=".5" width="599" height="299" rx="17.5" fill="none" stroke="url(#sweep)" stroke-width="1.5"/>
<g class="rise">
  <text x="32" y="48" class="mono" font-size="13" fill="#FF8A3D">02</text>
  <rect x="383" y="30" width="185" height="26" rx="13" fill="none" stroke="#3A3540"/><text x="476" y="47.5" text-anchor="middle" class="mono" font-size="12" fill="#CFC6BA">razorpay ai buildathon</text>
  <text x="30" y="106" class="serif" font-size="38" fill="#F4EEE4" letter-spacing="-.5">Recovery Agent</text>
  <text x="32" y="142" class="sans" font-size="16" fill="#A39CAA">Recovers failed recurring payments using only</text>
  <text x="32" y="166" class="sans" font-size="16" fill="#A39CAA">policy-safe moves, and stops when it should.</text>
</g>
<line x1="32" y1="196" x2="568" y2="196" stroke="#2A2630" stroke-dasharray="3 5"/>
<g class="rise" style="animation-delay:.25s">
  <text x="30" y="260" class="serif" font-size="54" fill="#FF8A3D">63%</text>
  <text x="155" y="238" class="mono" font-size="13" fill="#8B8592">recovered, vs 18% for a</text>
  <text x="155" y="258" class="mono" font-size="13" fill="#8B8592">naive baseline (synthetic)</text>
</g>
<line x1="464" y1="246" x2="470" y2="246" stroke="#6F6976" stroke-width="1.4"/><rect x="448" y="238" width="16" height="16" rx="4" fill="none" stroke="#6F6976" stroke-width="1.4"/><rect x="448" y="238" width="16" height="16" rx="4" fill="#FF8A3D" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.75;1" dur="3.2s" begin="0.00s" repeatCount="indefinite"/></rect><line x1="488" y1="246" x2="494" y2="246" stroke="#6F6976" stroke-width="1.4"/><rect x="472" y="238" width="16" height="16" rx="4" fill="none" stroke="#6F6976" stroke-width="1.4"/><rect x="472" y="238" width="16" height="16" rx="4" fill="#FF8A3D" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.75;1" dur="3.2s" begin="0.32s" repeatCount="indefinite"/></rect><line x1="512" y1="246" x2="518" y2="246" stroke="#6F6976" stroke-width="1.4"/><rect x="496" y="238" width="16" height="16" rx="4" fill="none" stroke="#6F6976" stroke-width="1.4"/><rect x="496" y="238" width="16" height="16" rx="4" fill="#FF8A3D" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.75;1" dur="3.2s" begin="0.64s" repeatCount="indefinite"/></rect><line x1="536" y1="246" x2="542" y2="246" stroke="#6F6976" stroke-width="1.4"/><rect x="520" y="238" width="16" height="16" rx="4" fill="none" stroke="#6F6976" stroke-width="1.4"/><rect x="520" y="238" width="16" height="16" rx="4" fill="#FF8A3D" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.75;1" dur="3.2s" begin="0.96s" repeatCount="indefinite"/></rect><rect x="544" y="238" width="16" height="16" rx="4" fill="none" stroke="#6F6976" stroke-width="1.4"/><rect x="544" y="238" width="16" height="16" rx="4" fill="#FF8A3D" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.75;1" dur="3.2s" begin="1.28s" repeatCount="indefinite"/></rect>
</svg>
