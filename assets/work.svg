<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" width="1200" height="104" role="img" aria-label="Selected work">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs><linearGradient id="ember-lilac" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#C98BDB"/></linearGradient></defs>
<rect width="1200" height="104" rx="22" fill="#121015"/><rect x=".5" y=".5" width="1199" height="103" rx="21.5" fill="none" stroke="#2A2630"/>

<g class="rise">
  <text x="40" y="62" class="mono" font-size="15" fill="#FF8A3D">02</text>
  <text x="78" y="66" class="serif" font-size="34" fill="#F4EEE4" letter-spacing="-.4">Selected work</text>
  <text x="1160" y="61" text-anchor="end" class="mono" font-size="13" fill="#8B8592">4 of 29 repositories</text>
</g>
<line x1="332" y1="56" x2="982" y2="56" stroke="#2A2630"/>
<line x1="332" y1="56" x2="982" y2="56" stroke="url(#ember-lilac)" stroke-width="1.4"
      stroke-dasharray="650" stroke-dashoffset="650">
  <animate attributeName="stroke-dashoffset" from="650" to="0" begin=".3s" dur="1.6s" fill="freeze"
           calcMode="spline" keySplines=".2 .7 .2 1" keyTimes="0;1"/>
</line>
<circle cy="56" r="3.2" fill="#FF8A3D">
  <animate attributeName="cx" values="332;982" dur="6s" begin="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="6s" begin="2s" repeatCount="indefinite"/>
</circle>
<circle cx="332" cy="56" r="3.2" fill="#FF8A3D" opacity="0"/>
</svg>
