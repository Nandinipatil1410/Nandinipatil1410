<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="arxiv-classifier: TinyLlama 1.1B fine-tuned to sort research papers into 11 arXiv categories.">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs><linearGradient id="ember-lilac" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#C98BDB"/></linearGradient><linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="260" y2="0">
  <stop offset="0" stop-color="#FF8A3D" stop-opacity="0"/><stop offset=".5" stop-color="#FF8A3D" stop-opacity=".85"/><stop offset="1" stop-color="#C98BDB" stop-opacity="0"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;900 0" dur="6s" begin="-4.2s" repeatCount="indefinite"/>
</linearGradient></defs>
<rect width="600" height="300" rx="18" fill="#121015"/><rect x=".5" y=".5" width="599" height="299" rx="17.5" fill="none" stroke="#2A2630"/>

<rect x=".5" y=".5" width="599" height="299" rx="17.5" fill="none" stroke="url(#sweep)" stroke-width="1.5"/>
<g class="rise">
  <text x="32" y="48" class="mono" font-size="13" fill="#FF8A3D">03</text>
  <rect x="515" y="30" width="53" height="26" rx="13" fill="none" stroke="#3A3540"/><text x="541" y="47.5" text-anchor="middle" class="mono" font-size="12" fill="#CFC6BA">lora</text><rect x="432" y="30" width="75" height="26" rx="13" fill="none" stroke="#3A3540"/><text x="469" y="47.5" text-anchor="middle" class="mono" font-size="12" fill="#CFC6BA">pytorch</text>
  <text x="30" y="106" class="serif" font-size="38" fill="#F4EEE4" letter-spacing="-.5">arxiv-classifier</text>
  <text x="32" y="142" class="sans" font-size="16" fill="#A39CAA">TinyLlama 1.1B fine-tuned to sort research</text>
  <text x="32" y="166" class="sans" font-size="16" fill="#A39CAA">papers into 11 arXiv categories.</text>
</g>
<line x1="32" y1="196" x2="568" y2="196" stroke="#2A2630" stroke-dasharray="3 5"/>
<g class="rise" style="animation-delay:.25s">
  <text x="30" y="260" class="serif" font-size="54" fill="#FF8A3D">84.3%</text>
  <text x="221" y="238" class="mono" font-size="13" fill="#8B8592">test accuracy, training</text>
  <text x="221" y="258" class="mono" font-size="13" fill="#8B8592">just 0.1% of the params</text>
</g>
<circle cx="452" cy="232" r="4" fill="#3A3540"/><circle cx="471" cy="232" r="4" fill="#3A3540"/><circle cx="490" cy="232" r="4" fill="#3A3540"/><circle cx="509" cy="232" r="4" fill="#3A3540"/><circle cx="528" cy="232" r="4" fill="#3A3540"/><circle cx="547" cy="232" r="4" fill="#3A3540"/><circle cx="461" cy="254" r="4" fill="#3A3540"/><circle cx="480" cy="254" r="4" fill="#3A3540"/><circle cx="499" cy="254" r="4" fill="#3A3540"/><circle cx="518" cy="254" r="4" fill="#3A3540"/><circle cx="537" cy="254" r="4" fill="#3A3540"/><circle r="7" fill="none" stroke="#FF8A3D" stroke-width="2"><animate attributeName="cx" calcMode="discrete" dur="4.4s" repeatCount="indefinite" values="452;480;509;518;471;537;547;490;499;528;461"/><animate attributeName="cy" calcMode="discrete" dur="4.4s" repeatCount="indefinite" values="232;254;232;254;232;254;232;232;254;232;254"/></circle>
</svg>
